<!DOCTYPE html>
<html>
    <head>
        <title>Saving Thanksgiving</title>
        <link rel="stylesheet" href="index.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Bitcount+Prop+Single+Ink:wght@100..900&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Bitcount+Prop+Single+Ink:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div id="header">
            <a class="header_link" href="pages/rules/rules.html">Rules</a>
            <h1 id="title">Saving Thanksgiving (WIP)</h1>
            <a class="header_link" href="pages/SDP/U2_Lab13_SDP.html">SDP</a>
        </div>

        <div class="column" id="main_column">
            <h1 id="player_turn">Player 1 Turn</h1>

            <div class="row" id="main_row">
                <div id="cards"></div>

                <div id="score">
                    <h1>Score</h1>
                    <div class="score_box">
                        <h1>Player 1 score: 0</h1>
                    </div>
                    <div class="score_box">
                        <h1>Player 2 score: 0</h1>
                    </div>
                    <div id="score_bottom">
                        <button class="reset_button">
                            <p>Reset</p>
                        </button>

                        <div class="column">
                            <p style="color: #FFFFFF; margin: 0 0 .2rem 0;">TOTAL</p>
                            <div id="total_score">
                                <div class="ts_box" id="p1">
                                    <p>000</p>
                                </div>

                                <div class="ts_box" id="p2">
                                    <p>000</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div id="notification">
            <h1 id="noti_title">Title</h1>
            <p id="noti_message">Message</p>
            <div>
                <button id="noti_reset">
                    <p>Reset</p>
                </button>
                <buton id="noti_close">
                    <p>Close</p>
                </buton>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script>genCards()</script>
    </body>
</html>
